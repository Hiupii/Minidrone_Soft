<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flycam Image Viewer</title>
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
  <div class="header">
    <header>
      <h1>Flycam Image Viewer</h1>
    </header>
  </div>
  <div class="container">

    <!-- Hiển thị ảnh hiện tại -->
    <section class="current-image-section card">
      <h2>Ảnh hiện tại</h2>
      <img id="current-image" src="/static/resources/input.jpeg" alt="Current Flycam Image">

      <button id="view-details" class="btn" style="display: none;">Xem chi tiết ảnh</button>

      <!-- Popup thông tin chi tiết sẽ hiển thị trong phần trống dưới ảnh -->
      <div id="detail-popup">
        <p><strong>Thời gian chụp:</strong> <span id="detail-timestamp">2024-10-20 12:30</span></p>
        <p><strong>Kích thước ảnh:</strong> 700x350</p>
        <p><strong>Định dạng:</strong> JPEG</p>
        <p><strong>IP Flycam:</strong> http://your-drone-ip-address</p>
      </div>
    </section>

    <!-- Phần lịch sử ảnh -->
    <section class="history-section card history-site">
      <h2>Lịch sử ảnh</h2>
      <div id="history-container">
        <!-- Ảnh hiển thị ban đầu (3 ảnh đầu tiên) -->
        <div id="initial-images">
          <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 1" data-timestamp="2024-10-19 14:00">
          <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 2" data-timestamp="2024-10-18 09:45">
          <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 3" data-timestamp="2024-10-17 16:20">
        </div>

        <!-- Phần cuộn với thanh kéo cho ảnh còn lại -->
        <div id="more-images">
            <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 4" data-timestamp="2024-10-16 14:10">
            <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 5" data-timestamp="2024-10-15 11:50">
            <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 6" data-timestamp="2024-10-14 13:30">
            <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 7" data-timestamp="2024-10-13 15:00">
            <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 8" data-timestamp="2024-10-12 12:10">
            <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 9" data-timestamp="2024-10-11 09:25">
            <img class="history-image" src="/static/resources/input.jpeg" alt="History Image 10" data-timestamp="2024-10-10 08:50">
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="../static/js/script.js"></script>
</body>
</html>
